<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#FFFFFF"/>
  <g transform="translate(0, 0)">
    <!-- Left Bracket < -->
    <polyline
      points="132,188 72,256 132,324"
      fill="none"
      stroke="#135293"
      stroke-width="28"
      stroke-linecap="square"
      stroke-linejoin="miter"
      stroke-miterlimit="4"
    />

    <!-- Forward Slash / -->
    <line
      x1="152"
      y1="362"
      x2="216"
      y2="150"
      stroke="#135293"
      stroke-width="30"
      stroke-linecap="square"
    />

    <!-- Outer C (Concentric) -->
    <path
      d="M 326,204 
         A 64,64 0 1 0 326,308"
      fill="none"
      stroke="#000000"
      stroke-width="30"
      stroke-linecap="square"
    />

    <!-- Inner C (Concentric) -->
    <path
      d="M 300,224 
         A 32,32 0 1 0 300,288"
      fill="none"
      stroke="#000000"
      stroke-width="20"
      stroke-linecap="square"
    />

    <!-- Right Bracket > -->
    <polyline
      points="380,188 440,256 380,324"
      fill="none"
      stroke="#135293"
      stroke-width="28"
      stroke-linecap="square"
      stroke-linejoin="miter"
      stroke-miterlimit="4"
    />
  </g>
</svg>